<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor">
  <!-- Outer orbital ellipse with inclination -->
  <ellipse cx="50" cy="50" rx="44" ry="22" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" transform="rotate(-25 50 50)"/>
  <!-- Middle operational orbit -->
  <ellipse cx="50" cy="50" rx="36" ry="14" stroke="currentColor" stroke-width="1.75" transform="rotate(35 50 50)"/>
  <!-- Central Earth Core -->
  <circle cx="50" cy="50" r="16" fill="url(#coreGradient)" stroke="currentColor" stroke-width="2"/>
  <!-- Atmosphere limb -->
  <circle cx="50" cy="50" r="19" stroke="#4E95FF" stroke-width="1" opacity="0.75" stroke-dasharray="1 2"/>
  <!-- Intersecting debris trajectory vector (critical red) -->
  <path d="M 12 78 Q 48 30 88 22" stroke="#EF4949" stroke-width="2" stroke-linecap="round"/>
  <!-- Tracking nodes -->
  <circle cx="78" cy="24" r="2.5" fill="#EF4949"/>
  <circle cx="32" cy="62" r="2" fill="#4E95FF"/>
  <circle cx="68" cy="42" r="2" fill="#F5F6F8"/>
  <defs>
    <radialGradient id="coreGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1A3459"/>
      <stop offset="60%" stop-color="#0E1929"/>
      <stop offset="100%" stop-color="#06090E"/>
    </radialGradient>
  </defs>
</svg>
