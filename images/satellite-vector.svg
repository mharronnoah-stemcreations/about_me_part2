<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Satellite Main Bus -->
  <rect x="34" y="28" width="12" height="24" rx="2" fill="#171C26" stroke="#82A8C6" stroke-width="1.5"/>
  <!-- Solar Panels Left -->
  <rect x="6" y="32" width="22" height="16" rx="1" fill="#0E1929" stroke="#4E95FF" stroke-width="1.2"/>
  <line x1="17" y1="32" x2="17" y2="48" stroke="#4E95FF" stroke-width="0.8" opacity="0.6"/>
  <line x1="6" y1="40" x2="28" y2="40" stroke="#4E95FF" stroke-width="0.8" opacity="0.6"/>
  <line x1="28" y1="40" x2="34" y2="40" stroke="#82A8C6" stroke-width="1.5"/>
  <!-- Solar Panels Right -->
  <rect x="52" y="32" width="22" height="16" rx="1" fill="#0E1929" stroke="#4E95FF" stroke-width="1.2"/>
  <line x1="63" y1="32" x2="63" y2="48" stroke="#4E95FF" stroke-width="0.8" opacity="0.6"/>
  <line x1="52" y1="40" x2="74" y2="40" stroke="#4E95FF" stroke-width="0.8" opacity="0.6"/>
  <line x1="46" y1="40" x2="52" y2="40" stroke="#82A8C6" stroke-width="1.5"/>
  <!-- High Gain Antenna Dish -->
  <path d="M 40 28 Q 40 18 34 14" stroke="#82A8C6" stroke-width="1.5"/>
  <path d="M 30 11 Q 35 15 40 18" stroke="#F5F6F8" stroke-width="1.5" fill="none"/>
  <!-- Thruster Nozzle -->
  <path d="M 37 52 L 43 52 L 45 58 L 35 58 Z" fill="#242B38" stroke="#656C77" stroke-width="1"/>
  <circle cx="40" cy="40" r="2" fill="#34D399"/>
</svg>
